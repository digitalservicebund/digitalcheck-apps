name: Preview (Astro)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  delete:

jobs:
  # Builds and deploys preview when PR is opened/updated or manually triggered.
  # Only runs for org contributors/members/owners.
  build-and-deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'delete' && 
      github.event.action != 'closed' && 
      !contains(github.actor, '[bot]') &&
      (github.event_name != 'pull_request' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association))
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Note: Can't use env.PREVIEW_BRANCH here as concurrency groups are evaluated before job env vars
      group: preview-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    env:
      GH_PAGES_BASE_URL: https://${{ github.event.repository.owner.login }}.github.io # https://digitalservicebund.github.io
      PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }} # e.g. my-feature-branch
      PREVIEW_BASE_PATH: /${{ github.event.repository.name }}/previews/${{ github.head_ref || github.ref_name }} # e.g. /digitalcheck-dito/previews/my-feature-branch
    environment:
      name: preview
      url: https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}/previews/${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build Astro for Preview
        run: pnpm build
        env:
          PUBLIC_STAGE: "preview"

      - name: Disable Jekyll # to allow assets being served from _astro directory
        run: touch dist/.nojekyll

      - name: Commit to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          branch: gh-pages
          target-folder: previews/${{ github.head_ref || github.ref_name }} # previews/my-feature-branch/
          clean: false # Prevents one branch preview from deleting others

      - name: Wait for automatic Pages deployment
        run: |
          MAX_TIME=40
          URL="$GH_PAGES_BASE_URL$PREVIEW_BASE_PATH"
          START_TIME=$(date +%s)

          while true; do
            RESPONSE_CODE=$(curl -s --head -o /dev/null -w "%{http_code}" "$URL")
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))
            
            if [ "$RESPONSE_CODE" -lt 400 ]; then
              exit 0
            elif [ "$ELAPSED_TIME" -ge "$MAX_TIME" ]; then
              echo "Timeout reached. Skipping."
              exit 1
            else
              echo "Waiting for 200... ($ELAPSED_TIME/$MAX_TIME seconds)"
              sleep 5
            fi
          done

      - name: Output Preview URL
        run: |
          echo "🔍 Preview deployed successfully!"
          echo "Preview URL: $GH_PAGES_BASE_URL$PREVIEW_BASE_PATH"

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW_URL="$GH_PAGES_BASE_URL$PREVIEW_BASE_PATH"
          gh pr comment ${{ github.event.pull_request.number }} --body "🔍 **Preview deployed!**

          Preview URL: $PREVIEW_URL"

  # Removes preview when PR is closed or branch is deleted.
  cleanup-preview:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'delete' && github.event.ref_type == 'branch') || 
      (github.event_name == 'pull_request' && github.event.action == 'closed')
    permissions:
      contents: write
    concurrency:
      group: preview-${{ github.head_ref || github.event.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Remove preview folder
        run: |
          PREVIEW_BRANCH="${{ github.head_ref || github.event.ref }}"
          PREVIEW_PATH="previews/$PREVIEW_BRANCH"

          if [ -d "$PREVIEW_PATH" ]; then
            echo "🗑️  Removing preview for branch: $PREVIEW_BRANCH"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PREVIEW_PATH"
            git commit -m "Remove preview for deleted branch: $PREVIEW_BRANCH"
            git push
            echo "✅ Preview removed successfully! (Automatic Pages deployment will update site)"
          else
            echo "ℹ️  No preview found for branch: $PREVIEW_BRANCH"
          fi
